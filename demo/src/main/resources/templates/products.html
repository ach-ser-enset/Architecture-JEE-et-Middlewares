<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des produits</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container mt-4">
    <h2>Liste des produits</h2>
    <form method="get" th:action="@{/products}">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Recherche..."/>
        <button type="submit" class="btn btn-primary btn-sm">Rechercher</button>
    </form>
    <a th:href="@{/formProduct}" class="btn btn-success btn-sm mb-2">Ajouter Produit</a>
    <table class="table table-bordered">
        <tr>
            <th>ID</th><th>Nom</th><th>Prix</th><th>Actions</th>
        </tr>
        <tr th:each="p : ${products}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${p.price}"></td>
            <td>
                <a th:href="@{/editProduct(id=${p.id})}" class="btn btn-warning btn-sm">Editer</a>
                <a th:href="@{/delete(id=${p.id},keyword=${keyword})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Confirmer la suppression ?')">Supprimer</a>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
